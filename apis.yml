description: BlueWillow Biologics is a clinical‑stage biotechnology company pioneering intranasal vaccine technology. Their NanoVax® platform
  delivers antigens via an oil‑in‑water emulsion, aiming to transform prevention and treatment of infectious diseases, pandemic preparedness,
  and food allergies. The company originated from University of Michigan research and now advances human clinical trials of its adjuvant and delivery
  system.

